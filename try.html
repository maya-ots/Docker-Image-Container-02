<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Products (Plain HTML)</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f5f5;
        color: #333;
      }
      .container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        text-align: center;
        margin-bottom: 2rem;
        font-weight: normal;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
      }

      /* ProductCard */

      .card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .thumb {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }
      .card-content {
        padding: 1rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .card-content h2 {
        margin: 0 0 0.5rem;
        font-size: 1.1rem;
      }
      .card-content p {
        flex: 1;
        margin: 0 0 1rem;
        color: #555;
        font-size: 0.95rem;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Market Products</h1>
      <div class="product-grid">
        <div class="card">
          <img
            class="thumb"
            src="https://picsum.photos/300/300/?image=39"
            alt="Ergonomic Concrete Chicken"
          />
          <div class="card-content">
            <h2>Ergonomic Concrete Chicken</h2>
            <p>Unbranded Granite Hat</p>
            <div class="meta">
              <span>💲 $275.15</span>
              <span>📦 44 in stock</span>
            </div>
          </div>
        </div>

        <div class="card">
          <img
            class="thumb"
            src="https://picsum.photos/300/300/?image=240"
            alt="Handcrafted Wooden Bowl"
          />
          <div class="card-content">
            <h2>Handcrafted Wooden Bowl</h2>
            <p>Artisan-carved bowl made from oak wood.</p>
            <div class="meta">
              <span>💲 $45.00</span>
              <span>📦 12 in stock</span>
            </div>
          </div>
        </div>

        <div class="card">
          <img
            class="thumb"
            src="https://picsum.photos/300/300/?image=250"
            alt="Vintage Leather Journal"
          />
          <div class="card-content">
            <h2>Vintage Leather Journal</h2>
            <p>Hand-bound journal with recycled paper.</p>
            <div class="meta">
              <span>💲 $25.50</span>
              <span>📦 30 in stock</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
